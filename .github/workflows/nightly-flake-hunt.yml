name: nightly flake hunt

# Copied in shape from aphrollo-tools .github/workflows/nightly-flake-hunt.yml
# at 12b3724e, where five flaky tests reached a merge in one week (a WaitDelay
# deadline, a real SIGTERM, a shared temp dir, a leaked goroutine, a lock-probe
# race) and every one was a shape -race -shuffle=on catches given repeats.
# The suite runs harder once a night than a pull request can afford:
# -count=5 so a flake with any real rate has several tries, -shuffle=on
# against ordering assumptions, on both runners since the Windows one is
# where trellis's own surprises came from. A red night is read by a person;
# the issue filer of the source is left out. The JSON stream and a plain log
# are kept as an artifact, and an empty stream after a failed run is named
# an infrastructure failure, as in the source (lines 60-85).

on:
  schedule:
    - cron: "25 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-flake-hunt
  cancel-in-progress: false

jobs:
  flake-hunt:
    if: github.repository == 'harryberg1n/trellis'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the suite under -race -shuffle=on -count=5
        shell: bash
        run: |
          set +e
          go test -race -shuffle=on -count=5 -timeout=3000s -json ./... > test.json
          code=$?
          # the plain log, as `go test` prints it, for a person reading a red night
          jq -rj 'select(.Action=="output") | .Output' test.json > test.log || true
          cat test.log
          # A `go test` that exited non-zero with an empty stream died before it
          # wrote one event (an out-of-memory kill, a hard process kill): no
          # test failed, so nothing else would call the night red.
          if [ "$code" != 0 ] && ! grep -q . test.json; then
            echo "::error::go test exited $code with an empty JSON stream: an infrastructure failure, not a flake"
            exit 1
          fi
          exit "$code"
      - name: keep the transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-${{ matrix.runner }}
          path: |
            test.json
            test.log
          if-no-files-found: ignore
