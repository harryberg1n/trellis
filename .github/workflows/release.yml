name: release

# A release is a merge that changes VERSION: the push to main that carries it
# builds the binaries and creates the GitHub Release, whose tag v<VERSION>
# goes on that commit. No hand tagging. The idea is aphrollo-tools' release
# job in .github/workflows/pipeline.yml and deploy/tag-release.sh at
# 12b3724e (the push to main earns its own tag, idempotent on an existing
# one), with VERSION as the decision instead of changelog fragments. A
# hand-pushed v* tag still builds, and must match VERSION.
#
# The publish step follows aphrollo-tools deploy/tag-release.sh:56-80 at
# 12b3724e. Incident: a release created and uploaded in one call, then
# cut short, left a release a re-run skipped for good. Here the release is
# created bare, the assets go up with --clobber and the checksums last, so a
# re-run finishes the upload, and a release with its checksums is complete.

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the tag this commit earns
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $tag" >&2
            exit 1
          fi
          # Only a gh that says "not found" means create. A release that has its
          # checksums is complete (they go up last) and is left alone; one
          # without them is a partial upload, and this run finishes it. Any
          # other gh failure stops here: a create would fail with "already
          # exists", or worse, run against a release it cannot see.
          if said=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>&1); then
            if grep -qx sha256sums.txt <<<"$said"; then
              echo "[skip] release $tag already has its checksums"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "release $tag exists without its checksums: uploading what it lacks"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            case "$said" in
              *"not found"*) ;;
              *)
                echo "gh release view $tag failed, so no release is created: $said" >&2
                exit 1
                ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: build
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          pkg=github.com/harryberg1n/trellis/internal/buildinfo
          ldflags="-s -w -X ${pkg}.Version=${TAG} -X ${pkg}.Commit=${GITHUB_SHA::7} -X ${pkg}.Time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "dist/trellis-${os}-${arch}${ext}" ./cmd/trellis
          done
          (cd dist && sha256sum trellis-* > sha256sums.txt)
      - name: smoke
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          dist/trellis-linux-amd64 version
          if [ "$(dist/trellis-linux-amd64 version | awk '{print $2}')" != "$TAG" ]; then
            echo "dist/trellis-linux-amd64 version does not name exactly $TAG" >&2
            exit 1
          fi
      - name: publish
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          EXISTS: ${{ steps.tag.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$EXISTS" != true ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/trellis-* --clobber
          gh release upload "$TAG" dist/sha256sums.txt --clobber
