name: ci

# Every commit on main lands through a pull request that trellis tree merge
# refuses unless the branch is up to date with main, so the pull request run
# already tests the exact content that reaches main. A run on the push to
# main would repeat it. workflow_dispatch is the hand-run for a given ref.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # The linux run never builds the *_windows.go files; lint them too.
      - name: golangci-lint (windows files)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.12.2
          skip-cache: true
      - run: go test -race ./...
      # The latency tests carry the !race build tag, so the step above skips
      # them: the race detector slows every call and would measure itself.
      # Informational: the M0 criterion is measured on the owner's box, and
      # hosted runners miss it. -v prints the measured p95 on a pass too.
      - name: hook latency (no -race, informational)
        continue-on-error: true
        run: go test ./internal/hook -run Latency -count=1 -v

  test-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # The latency tests carry the !race build tag, so the step above skips
      # them: the race detector slows every call and would measure itself.
      # Informational: the M0 criterion is measured on the owner's box, and
      # hosted runners miss it. -v prints the measured p95 on a pass too.
      - name: hook latency (no -race, informational)
        continue-on-error: true
        run: go test ./internal/hook -run Latency -count=1 -v

