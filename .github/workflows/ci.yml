name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      # The linux run never builds the *_windows.go files; lint them too.
      - name: golangci-lint (windows files)
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: windows
        with:
          version: v2.12.2
          skip-cache: true
      - run: go test -race ./...
      # The latency tests carry the !race build tag, so the step above skips
      # them: the race detector slows every call and would measure itself.
      # Informational: the M0 criterion is measured on the owner's box, and
      # hosted runners miss it. -v prints the measured p95 on a pass too.
      - name: hook latency (no -race, informational)
        continue-on-error: true
        run: go test ./internal/hook -run Latency -count=1 -v

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt would change:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # The latency tests carry the !race build tag, so the step above skips
      # them: the race detector slows every call and would measure itself.
      # Informational: the M0 criterion is measured on the owner's box, and
      # hosted runners miss it. -v prints the measured p95 on a pass too.
      - name: hook latency (no -race, informational)
        continue-on-error: true
        run: go test ./internal/hook -run Latency -count=1 -v

